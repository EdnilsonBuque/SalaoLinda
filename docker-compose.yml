services:
  mysql:
    image: mysql:8.4
    container_name: salaolinda-mysql
    restart: unless-stopped
    environment:
      # Dev local: root without password as per project constraints; do not use in production.
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: salao_linda
      TZ: Africa/Maputo
    ports:
      - "3306:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
